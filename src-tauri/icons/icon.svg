<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Terminal prompt >_ -->
  <text x="100" y="330" font-family="SF Mono, Menlo, monospace" font-size="200" font-weight="700" fill="#ffffff" opacity="0.95">&gt;_</text>
  <!-- Wireless signal arcs (remote element) -->
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <path d="M 340 120 A 60 60 0 0 1 340 240"/>
    <path d="M 370 90 A 100 100 0 0 1 370 270"/>
    <path d="M 400 60 A 140 140 0 0 1 400 300"/>
  </g>
  <!-- Small dot at signal origin -->
  <circle cx="340" cy="180" r="16" fill="#ffffff" opacity="0.9"/>
</svg>
