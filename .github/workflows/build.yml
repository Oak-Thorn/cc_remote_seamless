name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            sidecar_ext: ''
          - platform: macos-latest
            target: x86_64-apple-darwin
            sidecar_ext: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_ext: '.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: sidecar/feishu-gateway/go.sum

      - name: Build sidecar (feishu-gateway)
        shell: bash
        working-directory: sidecar/feishu-gateway
        env:
          GOOS: ${{ matrix.platform == 'windows-latest' && 'windows' || 'darwin' }}
          GOARCH: ${{ contains(matrix.target, 'aarch64') && 'arm64' || 'amd64' }}
        run: |
          go build -o "feishu-gateway-${{ matrix.target }}${{ matrix.sidecar_ext }}" .

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
